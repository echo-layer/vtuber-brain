[workspace]
resolver = "2"
members = [
    "crates/brain-core",
    "crates/brain-proto",
    "crates/brain-grpc",
]

[workspace.dependencies]
tonic = "0.12"
prost = "0.13"
tokio = { version = "1.0", features = ["full"] }
tower = "0.4"
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
vtuber-contracts = { version = "0.1.0", registry = "vtuber-registry" }
